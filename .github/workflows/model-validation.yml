name: Model Validation

on:
  workflow_dispatch:
    inputs:
      model_version:
        description: "Model version to validate and promote"
        required: true
        type: string

jobs:
  validate-and-promote:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run model validation tests
        run: uv run pytest ml/tests/ -m "not slow and not gpu" -v

      - name: Validate model metrics
        env:
          MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
          MODEL_VERSION: ${{ github.event.inputs.model_version }}
        run: |
          uv run python -m ml.validation.model_validator \
            --model-version "$MODEL_VERSION" \
            --min-f1 0.90 \
            --min-accuracy 0.90 \
            --max-latency-ms 100

      - name: Promote model to Production
        if: success()
        env:
          MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
          MODEL_VERSION: ${{ github.event.inputs.model_version }}
        run: |
          uv run python -c "
          import mlflow
          client = mlflow.tracking.MlflowClient()
          client.transition_model_version_stage(
              name='areteusml',
              version='$MODEL_VERSION',
              stage='Production',
              archive_existing_versions=True,
          )
          print(f'Model version $MODEL_VERSION promoted to Production')
          "
