[project]
name = "areteusml"
version = "0.1.0"
description = "Production ML text classification pipeline for Banking77 intent detection"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11,<3.13"
authors = [{ name = "Daniel Alexis Cruz", email = "danielalexiscruz.pro@gmail.com" }]

dependencies = [
    # ML Core
    "torch>=2.6.0,<3",
    "transformers>=5.3.0,<6",
    "datasets>=5.0.1,<6",
    "tokenizers>=0.22.0,<0.24",
    "accelerate>=1.4.0,<2",
    "setfit>=1.1.3,<2",
    "sentence-transformers>=5.6.0,<7",
    "scikit-learn==1.9.1",
    "optuna==5.0.0",
    "shap==0.51.0",
    # Data
    "pandas==3.1.0",
    "numpy==2.4.6",
    "pandera==0.34.1",
    "dvc>=3.59,<4",
    "dvc-s3>=3.2,<4",
    "pathspec<2",
    # Experiment Tracking
    "mlflow>=3.11.1,<4",
    # Inference
    "onnx>=1.22.0,<2",
    "onnxruntime==1.31.0",
    "optimum>=2.2.0,<3",
    # API
    "fastapi>=0.139.0,<1",
    "uvicorn[standard]==0.54.0",
    "pydantic==2.14.1",
    "pydantic-settings==2.16.1",
    "pyjwt>=2.12,<3",
    "passlib[bcrypt]==1.7.4",
    "redis==8.1.0",
    "slowapi==0.1.10",
    "httpx==0.28.1",
    # Monitoring
    "evidently==0.7.23",
    "prometheus-client==0.26.0",
    # Dashboard
    "streamlit>=1.54.0,<2",
    "streamlit-shadcn-ui==1.4.0",
    "streamlit-elements==0.1.0",
    "plotly>=5.10.0,<6",
    # Orchestration
    "dagster>=1.13.1,<2",
    "dagster-webserver>=1.13.1,<2",
    # Database
    "sqlalchemy==2.1.6",
    "psycopg2-binary==2.9.13",
    "alembic==1.20.1",
    # Utilities
    "python-dotenv==1.2.4",
    "loguru==0.7.3",
    "rich==15.0.0",
    "typer==0.27.3",
    "onnxscript>=0.6.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3,<10",
    "pytest-asyncio>=1.0.0,<2",
    "pytest-cov==7.1.0",
    "ruff==0.17.2",
    "pre-commit==4.7.0",
    "locust==2.47.0",
    "ipykernel==6.29.5",
    "jupyter==1.1.1",
    "matplotlib==3.11.2",
    "seaborn==0.13.2",
]

labeling = [
    "argilla==2.8.0",
]

[tool.uv]
environments = [
    "sys_platform == 'linux'",
    "sys_platform == 'win32'",
]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu126" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ml", "backend"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "S",   # flake8-bandit
    "T20", # flake8-print
    "SIM", # flake8-simplify
    "TCH", # flake8-type-checking
    "RUF", # ruff-specific
]
ignore = [
    "S101",  # assert used (needed for tests)
    "S105",  # hardcoded password (false positives in config)
    "E501",  # line too long (handled by formatter)
    "B008",  # Depends() in defaults (FastAPI pattern)
    "N803",  # X_train/X_test naming (ML convention)
    "N806",  # X_train/X_test variables (ML convention)
    "S104",  # binding to 0.0.0.0 (intentional for Docker)
    "S301",  # pickle load (trusted internal models only)
    "TC002", # type-checking imports (over-optimization)
]

[tool.ruff.lint.per-file-ignores]
"ml/notebooks/*" = ["T20", "E402"]
"notebooks/*" = ["T20", "E402", "S603", "S607"]
"scripts/*" = ["T20", "E402", "S603", "S607"]
"backend/tests/*" = ["S101", "S106"]
"ml/tests/*" = ["S101"]
"ml/utils/reproducibility.py" = ["T20"]

[tool.pytest.ini_options]
testpaths = ["backend/tests", "ml/tests"]
asyncio_mode = "auto"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "gpu: marks tests requiring GPU",
    "integration: marks integration tests",
]
